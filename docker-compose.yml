version: '3.7'

services:
  user_service:
    build: .
    ports:
      - "8001:8001"
    depends_on:
      - user_db
    env_file:
      - ./user-service/.env

  user_db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
